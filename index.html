<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venice Sporting Center</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #0D7C5F;
      --accent-light: #E6F5F0;
      --accent2: #D97706;
      --accent2-light: #FEF3C7;
      --text: #1A2332;
      --text-secondary: #5A6578;
      --bg: #F7F8FA;
      --bg-warm: #FFFBF5;
      --border: #E2E6EC;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: #fff; -webkit-font-smoothing: antialiased; font-family: 'DM Sans', sans-serif; }

    @media (max-width: 768px) {
      .hero-grid { grid-template-columns: 1fr !important; }
      .desktop-nav { display: none !important; }
      .mobile-toggle { display: flex !important; }
      .gallery-grid { grid-template-columns: 1fr 1fr !important; }
      .gallery-grid > div { grid-column: span 1 !important; }
      .two-col { grid-template-columns: 1fr !important; }
    }
    @media (min-width: 769px) {
      .mobile-menu { display: none !important; }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    /* ─── NAV ─── */
    const NAV_ITEMS = [
      { id: 'home', label: 'Home' },
      { id: 'chi-siamo', label: 'Chi Siamo' },
      { id: 'prenotazioni', label: 'Prenotazioni' },
      { id: 'scuola-tennis', label: 'Scuola Tennis' },
      { id: 'contatti', label: 'Contatti' },
    ];

    function Nav({ currentPage, setPage, scrolled }) {
      const [mobileOpen, setMobileOpen] = React.useState(false);

      const navLinkStyle = (active) => ({
        padding: '8px 16px', borderRadius: 8, cursor: 'pointer',
        fontSize: 14, fontWeight: active ? 700 : 500, fontFamily: 'DM Sans, sans-serif',
        color: active ? 'var(--accent)' : 'var(--text)',
        background: active ? 'var(--accent-light)' : 'transparent',
        border: 'none', transition: 'all 0.2s',
      });

      const socialIconStyle = {
        width: 36, height: 36, borderRadius: '50%', display: 'flex',
        alignItems: 'center', justifyContent: 'center', background: 'var(--accent-light)',
        color: 'var(--accent)', cursor: 'pointer', border: 'none', transition: 'all 0.2s',
        textDecoration: 'none',
      };

      return (
        <header style={{
          position: 'fixed', top: 0, left: 0, right: 0, zIndex: 1000,
          background: scrolled ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.8)',
          backdropFilter: 'blur(12px)',
          boxShadow: scrolled ? '0 1px 12px rgba(0,0,0,0.08)' : 'none',
          transition: 'background 0.3s, box-shadow 0.3s',
        }}>
          <div style={{
            maxWidth: 1280, margin: '0 auto', padding: '0 32px', height: 72,
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          }}>
            {/* Logo area */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer' }}
              onClick={() => { setPage('home'); setMobileOpen(false); }}>
              <img src="assets/logo-vsc.png" alt="Venice Sporting Center" style={{ height: 64, width: 'auto', objectFit: 'contain' }} />
              <img src="assets/logo-polisportiva-bissuola.png" alt="Polisportiva Bissuola" style={{ height: 140, width: 'auto', objectFit: 'contain' }} />
              <div style={{ fontFamily: 'Sora, sans-serif', fontWeight: 700, fontSize: 15, color: 'var(--text)', lineHeight: 1.2 }}>
                Venice<br/>Sporting Center
              </div>
            </div>

            {/* Desktop nav */}
            <nav style={{ display: 'flex', alignItems: 'center', gap: 4 }} className="desktop-nav">
              {NAV_ITEMS.map(item => (
                <button key={item.id} style={navLinkStyle(currentPage === item.id)}
                  onClick={() => setPage(item.id)}
                  onMouseEnter={e => { if (currentPage !== item.id) e.target.style.background = 'var(--accent-light)'; }}
                  onMouseLeave={e => { if (currentPage !== item.id) e.target.style.background = 'transparent'; }}>
                  {item.label}
                </button>
              ))}
            </nav>

            {/* Social icons */}
            <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginLeft: 16 }} className="desktop-nav">
              <a href="https://www.instagram.com/venicesportingcenter/" target="_blank" rel="noopener noreferrer" style={socialIconStyle}
                onMouseEnter={e => { e.currentTarget.style.background = 'var(--accent)'; e.currentTarget.style.color = '#fff'; }}
                onMouseLeave={e => { e.currentTarget.style.background = 'var(--accent-light)'; e.currentTarget.style.color = 'var(--accent)'; }}
                title="Instagram">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5"/></svg>
              </a>
              <a href="https://www.facebook.com/VscLaFavorita/" target="_blank" rel="noopener noreferrer" style={socialIconStyle}
                onMouseEnter={e => { e.currentTarget.style.background = 'var(--accent)'; e.currentTarget.style.color = '#fff'; }}
                onMouseLeave={e => { e.currentTarget.style.background = 'var(--accent-light)'; e.currentTarget.style.color = 'var(--accent)'; }}
                title="Facebook">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
              </a>
            </div>

            {/* Mobile hamburger */}
            <button style={{ display: 'none', background: 'none', border: 'none', cursor: 'pointer', padding: 8, color: 'var(--text)' }}
              className="mobile-toggle" onClick={() => setMobileOpen(!mobileOpen)}>
              {mobileOpen
                ? <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                : <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
              }
            </button>
          </div>

          {/* Mobile menu */}
          {mobileOpen && (
            <div className="mobile-menu" style={{
              background: 'rgba(255,255,255,0.98)', padding: '16px 32px 24px',
              display: 'flex', flexDirection: 'column', gap: 4, borderTop: '1px solid var(--border)',
            }}>
              {NAV_ITEMS.map(item => (
                <button key={item.id} style={{ padding: '10px 16px', borderRadius: 8, cursor: 'pointer',
                  fontSize: 15, fontWeight: currentPage === item.id ? 700 : 500, fontFamily: 'DM Sans, sans-serif',
                  color: currentPage === item.id ? 'var(--accent)' : 'var(--text)',
                  background: currentPage === item.id ? 'var(--accent-light)' : 'transparent',
                  border: 'none', textAlign: 'left' }}
                  onClick={() => { setPage(item.id); setMobileOpen(false); }}>
                  {item.label}
                </button>
              ))}
            </div>
          )}
        </header>
      );
    }

    /* ─── HOMEPAGE ─── */
    function HomePage({ setPage }) {
      const [heroVisible, setHeroVisible] = React.useState(false);
      const [videoIndex, setVideoIndex] = React.useState(0);
      const [prevIndex, setPrevIndex] = React.useState(null);
      const [sliding, setSliding] = React.useState(false);
      const heroVideos = [
        'assets/videos/campi_tennis_drone_view.mp4.mp4',
        'assets/videos/campi_calcetto_drone_view.mp4',
        'assets/videos/campi_beach_drone_view.mp4',
      ];
      React.useEffect(() => { const t = setTimeout(() => setHeroVisible(true), 80); return () => clearTimeout(t); }, []);

      const goTo = (idx) => {
        if (sliding || idx === videoIndex) return;
        setPrevIndex(videoIndex);
        setVideoIndex(idx);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          setSliding(true);
          setTimeout(() => { setSliding(false); setPrevIndex(null); }, 650);
        }));
      };

      return (
        <div>
          {/* Hero */}
          <section style={{
            minHeight: '100vh', display: 'flex', alignItems: 'center',
            position: 'relative', overflow: 'hidden',
            background: 'linear-gradient(135deg, var(--bg) 0%, var(--accent-light) 100%)',
          }}>
            {/* Venetian wave pattern */}
            <div style={{ position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, opacity: 0.06, pointerEvents: 'none' }}>
              <svg width="100%" height="100%" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
                {[...Array(8)].map((_, i) => (
                  <path key={i}
                    d={`M-100 ${200 + i * 80} Q 360 ${150 + i * 80 + (i % 2 ? 40 : -40)} 720 ${200 + i * 80} T 1540 ${200 + i * 80}`}
                    stroke="var(--accent)" fill="none" strokeWidth="2" />
                ))}
              </svg>
            </div>

            <div style={{
              maxWidth: 1280, margin: '0 auto', padding: '120px 32px 80px',
              display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 64, alignItems: 'center', width: '100%',
            }} className="hero-grid">
              <div style={{
                transform: heroVisible ? 'translateY(0)' : 'translateY(30px)',
                opacity: heroVisible ? 1 : 0, transition: 'all 0.8s cubic-bezier(0.16, 1, 0.3, 1)',
              }}>
                <div style={{
                  display: 'inline-block', padding: '6px 14px', borderRadius: 20,
                  background: 'var(--accent)', color: '#fff', fontSize: 13, fontWeight: 600,
                  fontFamily: 'DM Sans, sans-serif', marginBottom: 20, letterSpacing: 0.5,
                }}>Mestre, Venezia</div>
                <h1 style={{
                  fontFamily: 'Sora, sans-serif', fontSize: 'clamp(36px, 5vw, 64px)',
                  fontWeight: 800, lineHeight: 1.08, color: 'var(--text)',
                  marginBottom: 20, letterSpacing: '-0.02em',
                }}>
                  Il tuo centro<br/>sportivo a<br/>
                  <span style={{ color: 'var(--accent)' }}>Venezia</span>
                </h1>
                <p style={{
                  fontFamily: 'DM Sans, sans-serif', fontSize: 18, lineHeight: 1.6,
                  color: 'var(--text-secondary)', maxWidth: 440, marginBottom: 32,
                }}>
                  Tennis, calcio a 5, beach volley e tanto altro. Prenota il tuo campo, scopri i nostri corsi e vivi lo sport con noi.
                </p>
                <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
                  <button onClick={() => setPage('prenotazioni')} style={{
                    padding: '14px 32px', borderRadius: 12, border: 'none',
                    background: 'var(--accent)', color: '#fff', fontSize: 16, fontWeight: 700,
                    fontFamily: 'DM Sans, sans-serif', cursor: 'pointer',
                    transition: 'all 0.2s', boxShadow: '0 4px 20px rgba(13,124,95,0.3)',
                  }}
                    onMouseEnter={e => e.currentTarget.style.transform = 'translateY(-2px)'}
                    onMouseLeave={e => e.currentTarget.style.transform = 'translateY(0)'}>
                    Prenota un Campo
                  </button>
                  <button onClick={() => setPage('chi-siamo')} style={{
                    padding: '14px 32px', borderRadius: 12,
                    border: '2px solid var(--border)', background: 'transparent',
                    color: 'var(--text)', fontSize: 16, fontWeight: 600,
                    fontFamily: 'DM Sans, sans-serif', cursor: 'pointer', transition: 'all 0.2s',
                  }}
                    onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--accent)'; e.currentTarget.style.color = 'var(--accent)'; }}
                    onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.color = 'var(--text)'; }}>
                    Scopri il Centro
                  </button>
                </div>
              </div>

              <div style={{
                transform: heroVisible ? 'translateY(0)' : 'translateY(40px)',
                opacity: heroVisible ? 1 : 0, transition: 'all 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s',
              }}>
                <div style={{ position: 'relative', width: 'fit-content', height: 720, borderRadius: 20, overflow: 'hidden', boxShadow: '0 24px 80px rgba(0,0,0,0.15)' }}>
                  {/* Video uscente — scivola a sinistra */}
                  {prevIndex !== null && (
                    <div style={{
                      position: 'absolute', top: 0, left: 0, height: '100%', zIndex: 2,
                      transform: sliding ? 'translateX(-100%)' : 'translateX(0)',
                      transition: sliding ? 'transform 0.6s cubic-bezier(0.4,0,0.2,1)' : 'none',
                    }}>
                      <video muted playsInline style={{ width: 'auto', height: '100%', display: 'block' }}>
                        <source src={heroVideos[prevIndex]} type="video/mp4" />
                      </video>
                    </div>
                  )}
                  {/* Video entrante — in-flow (mantiene la larghezza del contenitore), entra da destra */}
                  <div style={{
                    height: '100%',
                    transform: (prevIndex !== null && !sliding) ? 'translateX(100%)' : 'translateX(0)',
                    transition: (prevIndex !== null && sliding) ? 'transform 0.6s cubic-bezier(0.4,0,0.2,1)' : 'none',
                  }}>
                    <video key={videoIndex} autoPlay muted playsInline
                      onEnded={() => goTo((videoIndex + 1) % heroVideos.length)}
                      style={{ width: 'auto', height: '100%', display: 'block' }}>
                      <source src={heroVideos[videoIndex]} type="video/mp4" />
                    </video>
                  </div>
                </div>
                <div style={{ display: 'flex', gap: 8, justifyContent: 'center', marginTop: 16 }}>
                  {heroVideos.map((_, i) => (
                    <button key={i} onClick={() => goTo(i)} style={{
                      width: i === videoIndex ? 24 : 8, height: 8, borderRadius: 4, border: 'none', cursor: 'pointer',
                      background: i === videoIndex ? 'var(--accent)' : 'rgba(0,0,0,0.2)',
                      transition: 'all 0.3s', padding: 0,
                    }} />
                  ))}
                </div>
              </div>
            </div>
          </section>

          {/* Sport Cards */}
          <section style={{ background: '#fff', padding: '80px 32px' }}>
            <div style={{ maxWidth: 1280, margin: '0 auto' }}>
              <div style={{ textAlign: 'center', marginBottom: 48 }}>
                <h2 style={{ fontFamily: 'Sora, sans-serif', fontSize: 36, fontWeight: 800, color: 'var(--text)', marginBottom: 12 }}>
                  I Nostri Sport
                </h2>
                <p style={{ fontFamily: 'DM Sans, sans-serif', fontSize: 17, color: 'var(--text-secondary)' }}>
                  Tre discipline, un unico centro. Scegli il tuo campo e gioca.
                </p>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: 24 }}>
                {[
                  { sport: 'Tennis', icon: '🎾', desc: '4 campi in terra rossa e 2 in sintetico. Scuola tennis per tutte le età.', bg: '#E8F5E9' },
                  { sport: 'Calcio a 5', icon: '⚽', desc: 'Campi in erba sintetica per partite, tornei e divertimento tra amici. Non istituzionale!', bg: '#FFF3E0' },
                  { sport: 'Beach Volley', icon: '🏐', desc: 'Campi in sabbia per tornei estivi e partite libere.', bg: '#E3F2FD' },
                ].map((s, i) => (
                  <div key={i} style={{
                    padding: 32, borderRadius: 16, background: s.bg, cursor: 'pointer',
                    transition: 'all 0.3s', border: '1px solid transparent',
                  }}
                    onMouseEnter={e => { e.currentTarget.style.transform = 'translateY(-4px)'; e.currentTarget.style.boxShadow = '0 12px 40px rgba(0,0,0,0.08)'; }}
                    onMouseLeave={e => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.boxShadow = 'none'; }}
                    onClick={() => setPage('prenotazioni')}>
                    <div style={{ fontSize: 40, marginBottom: 16 }}>{s.icon}</div>
                    <h3 style={{ fontFamily: 'Sora, sans-serif', fontSize: 22, fontWeight: 700, marginBottom: 8, color: 'var(--text)' }}>{s.sport}</h3>
                    <p style={{ fontFamily: 'DM Sans, sans-serif', fontSize: 15, lineHeight: 1.6, color: 'var(--text-secondary)', marginBottom: 16 }}>{s.desc}</p>
                    <span style={{ fontFamily: 'DM Sans, sans-serif', fontSize: 14, fontWeight: 600, color: 'var(--accent)' }}>Prenota ora →</span>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Event CTA Banner */}
          <section style={{ background: 'var(--accent)', padding: '48px 32px', position: 'relative', overflow: 'hidden' }}>
            <div style={{
              position: 'absolute', inset: 0, opacity: 0.1,
              background: 'repeating-linear-gradient(120deg, transparent, transparent 40px, rgba(255,255,255,0.3) 40px, rgba(255,255,255,0.3) 42px)',
            }} />
            <div style={{
              maxWidth: 1280, margin: '0 auto', display: 'flex', alignItems: 'center',
              justifyContent: 'space-between', position: 'relative', flexWrap: 'wrap', gap: 24,
            }}>
              <div>
                <div style={{
                  display: 'inline-block', padding: '4px 12px', borderRadius: 6,
                  background: 'rgba(255,255,255,0.2)', color: '#fff', fontSize: 12,
                  fontWeight: 700, fontFamily: 'DM Sans, sans-serif', marginBottom: 8,
                  textTransform: 'uppercase', letterSpacing: 1,
                }}>Evento in arrivo</div>
                <h3 style={{ fontFamily: 'Sora, sans-serif', fontSize: 28, fontWeight: 800, color: '#fff', marginBottom: 4 }}>
                  Torneo Beach Volley Estivo 2026
                </h3>
                <p style={{ fontFamily: 'DM Sans, sans-serif', fontSize: 16, color: 'rgba(255,255,255,0.85)' }}>
                  Iscrizioni aperte! 12-13 Luglio · Coppie miste
                </p>
              </div>
              <button onClick={() => setPage('contatti')} style={{
                padding: '14px 28px', borderRadius: 12, border: '2px solid #fff',
                background: '#fff', color: 'var(--accent)', fontSize: 16, fontWeight: 700,
                fontFamily: 'DM Sans, sans-serif', cursor: 'pointer', transition: 'all 0.2s', whiteSpace: 'nowrap',
              }}
                onMouseEnter={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = '#fff'; }}
                onMouseLeave={e => { e.currentTarget.style.background = '#fff'; e.currentTarget.style.color = 'var(--accent)'; }}>
                Scopri di più
              </button>
            </div>
          </section>

          {/* Bar Section */}
          <section style={{ background: 'var(--bg-warm)', padding: '80px 32px' }}>
            <div style={{ maxWidth: 720, margin: '0 auto' }}>
              <div>
                <h2 style={{ fontFamily: 'Sora, sans-serif', fontSize: 32, fontWeight: 800, color: 'var(--text)', marginBottom: 16 }}>
                  Bar & Ristoro
                </h2>
                <p style={{ fontFamily: 'DM Sans, sans-serif', fontSize: 16, lineHeight: 1.7, color: 'var(--text-secondary)', marginBottom: 16 }}>
                  Dopo la partita, rilassati nel nostro bar con vista sui campi. Bevande fresche, snack e la possibilità di organizzare rinfreschi con cibo esterno per i tuoi eventi.
                </p>
                <p style={{ fontFamily: 'DM Sans, sans-serif', fontSize: 16, lineHeight: 1.7, color: 'var(--text-secondary)', marginBottom: 24 }}>
                  Ideale per compleanni, feste di fine torneo e ritrovi sportivi.
                </p>
                <button onClick={() => setPage('contatti')} style={{
                  padding: '12px 24px', borderRadius: 10, border: '2px solid var(--accent2)',
                  background: 'transparent', color: 'var(--accent2)', fontSize: 15, fontWeight: 600,
                  fontFamily: 'DM Sans, sans-serif', cursor: 'pointer', transition: 'all 0.2s',
                }}
                  onMouseEnter={e => { e.currentTarget.style.background = 'var(--accent2)'; e.currentTarget.style.color = '#fff'; }}
                  onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = 'var(--accent2)'; }}>
                  Contattaci per prenotare
                </button>
              </div>
            </div>
          </section>

          {/* Quick CTA */}
          <section style={{ background: '#fff', padding: '64px 32px' }}>
            <div style={{ maxWidth: 800, margin: '0 auto', textAlign: 'center' }}>
              <h2 style={{ fontFamily: 'Sora, sans-serif', fontSize: 32, fontWeight: 800, color: 'var(--text)', marginBottom: 12 }}>
                Pronto a giocare?
              </h2>
              <p style={{ fontFamily: 'DM Sans, sans-serif', fontSize: 17, color: 'var(--text-secondary)', marginBottom: 32 }}>
                Prenota il tuo campo in pochi click su Playtomic
              </p>
              <button onClick={() => setPage('prenotazioni')} style={{
                padding: '16px 40px', borderRadius: 14, border: 'none',
                background: 'var(--accent)', color: '#fff', fontSize: 17, fontWeight: 700,
                fontFamily: 'DM Sans, sans-serif', cursor: 'pointer',
                boxShadow: '0 4px 24px rgba(13,124,95,0.3)', transition: 'all 0.2s',
              }}
                onMouseEnter={e => e.currentTarget.style.transform = 'translateY(-2px)'}
                onMouseLeave={e => e.currentTarget.style.transform = 'translateY(0)'}>
                Vai alle Prenotazioni
              </button>
            </div>
          </section>
        </div>
      );
    }

    /* ─── CHI SIAMO ─── */
    function ChiSiamoPage() {
      return (
        <div style={{ paddingTop: 72 }}>
          {/* Hero */}
          <section style={{ background: 'var(--accent-light)', padding: '64px 32px 80px' }}>
            <div style={{ maxWidth: 1280, margin: '0 auto' }}>
              <h1 style={{ fontFamily: 'Sora, sans-serif', fontSize: 48, fontWeight: 800, color: 'var(--text)', marginBottom: 16 }}>
                Chi Siamo
              </h1>
              <p style={{ fontFamily: 'DM Sans, sans-serif', fontSize: 18, color: 'var(--text-secondary)', maxWidth: 600, lineHeight: 1.6 }}>
                Un punto di riferimento per lo sport a Mestre dal 1985. Scopri la nostra storia, i nostri impianti e la filosofia che ci guida.
              </p>
            </div>
          </section>

          {/* Storia */}
          <section style={{ padding: '80px 32px', background: '#fff' }}>
            <div style={{ maxWidth: 1280, margin: '0 auto', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 48, alignItems: 'center' }} className="hero-grid">
              <div>
                <div style={{ fontSize: 12, fontWeight: 700, fontFamily: 'DM Sans, sans-serif', color: 'var(--accent)', textTransform: 'uppercase', letterSpacing: 2, marginBottom: 12 }}>La nostra storia</div>
                <h2 style={{ fontFamily: 'Sora, sans-serif', fontSize: 32, fontWeight: 800, color: 'var(--text)', marginBottom: 16 }}>
                  Dal 1985, passione per lo sport
                </h2>
                <p style={{ fontFamily: 'DM Sans, sans-serif', fontSize: 16, lineHeight: 1.7, color: 'var(--text-secondary)', marginBottom: 16 }}>

          <section style={{ background: 'var(--accent-light)', padding: '64px 32px 80px' }}>
            <div style={{ maxWidth: 1280, margin: '0 auto' }}>
              <h1 style={{ fontFamily: 'Sora, sans-serif', fontSize: 48, fontWeight: 800, color: 'var(--text)', marginBottom: 16 }}>Tornei</h1>
              <p style={{ fontFamily: 'DM Sans, sans-serif', fontSize: 18, color: 'var(--text-secondary)', maxWidth: 600, lineHeight: 1.6 }}>
                Scopri i prossimi tornei e iscriviti. Calcio a 5, beach volley e tennis: c'è spazio per tutti.
              </p>
            </div>
          </section>

          <section style={{ padding: '48px 32px', background: '#fff' }}>
            <div style={{ maxWidth: 1280, margin: '0 auto' }}>
              <div style={{ display: 'flex', gap: 8, marginBottom: 32, flexWrap: 'wrap' }}>
                {[
                  { id: 'tutti', label: 'Tutti' },
                  { id: 'calcio', label: '⚽ Calcio a 5' },
                  { id: 'beach', label: '🏐 Beach Volley' },
                  { id: 'tennis', label: '🎾 Tennis' },
                ].map(f => (
                  <button key={f.id} onClick={() => setFilter(f.id)} style={{
                    padding: '8px 20px', borderRadius: 20, cursor: 'pointer',
                    fontFamily: 'DM Sans, sans-serif', fontSize: 14, fontWeight: 600,
                    background: filter === f.id ? 'var(--accent)' : 'var(--bg)',
                    color: filter === f.id ? '#fff' : 'var(--text-secondary)',
                    border: filter === f.id ? 'none' : '1px solid var(--border)',
                    transition: 'all 0.2s',
                  }}>{f.label}</button>
                ))}
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(340px, 1fr))', gap: 24 }}>
                {filtered.map((t, i) => (
                  <div key={`${filter}-${i}`} style={{
                    padding: 28, borderRadius: 16, background: t.color,
                    border: `1px solid ${t.accent}22`, transition: 'all 0.3s',
                  }}
                    onMouseEnter={e => e.currentTarget.style.transform = 'translateY(-3px)'}
                    onMouseLeave={e => e.currentTarget.style.transform = 'translateY(0)'}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 12, gap: 8 }}>
                      <h3 style={{ fontFamily: 'Sora, sans-serif', fontSize: 19, fontWeight: 700, color: 'var(--text)' }}>{t.name}</h3>
                      <span style={{
                        padding: '4px 10px', borderRadius: 6, whiteSpace: 'nowrap',
                        background: t.status === 'Iscrizioni aperte' ? '#C8E6C9' : '#FFF9C4',
                        fontSize: 11, fontWeight: 700, fontFamily: 'DM Sans, sans-serif',
                        color: t.status === 'Iscrizioni aperte' ? '#1B5E20' : '#F57F17',
                      }}>{t.status}</span>
                    </div>
                    <div style={{ fontFamily: 'DM Sans, sans-serif', fontSize: 14, fontWeight: 600, color: t.accent, marginBottom: 8 }}>📅 {t.date}</div>
                    <p style={{ fontFamily: 'DM Sans, sans-serif', fontSize: 14, lineHeight: 1.6, color: 'var(--text-secondary)', marginBottom: 12 }}>{t.desc}</p>
                    <div style={{ fontFamily: 'DM Sans, sans-serif', fontSize: 13, color: 'var(--text-secondary)', marginBottom: 16 }}>🏆 {t.prize}</div>
                    {t.status === 'Iscrizioni aperte' && (
                      <button style={{
                        padding: '10px 20px', borderRadius: 10, border: 'none',
                        background: t.accent, color: '#fff', fontSize: 14, fontWeight: 700,
                        fontFamily: 'DM Sans, sans-serif', cursor: 'pointer', transition: 'opacity 0.2s',
                      }}
                        onMouseEnter={e => e.currentTarget.style.opacity = '0.85'}
                        onMouseLeave={e => e.currentTarget.style.opacity = '1'}>
                        Iscriviti ora
                      </button>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </section>
        </div>
      );
    }

    /* ─── CONTATTI ─── */
    function ContattiPage() {
      return (
        <div style={{ paddingTop: 72 }}>
          <section style={{ background: 'var(--accent-light)', padding: '64px 32px 80px' }}>
            <div style={{ maxWidth: 1280, margin: '0 auto' }}>
              <h1 style={{ fontFamily: 'Sora, sans-serif', fontSize: 48, fontWeight: 800, color: 'var(--text)', marginBottom: 16 }}>Contatti</h1>
              <p style={{ fontFamily: 'DM Sans, sans-serif', fontSize: 18, color: 'var(--text-secondary)', maxWidth: 600, lineHeight: 1.6 }}>
                Vieni a trovarci o contattaci per informazioni ed eventi.
              </p>
            </div>
          </section>

          <section style={{ padding: '64px 32px', background: '#fff' }}>
            <div style={{ maxWidth: 800, margin: '0 auto' }}>
              <h2 style={{ fontFamily: 'Sora, sans-serif', fontSize: 28, fontWeight: 800, color: 'var(--text)', marginBottom: 24 }}>Dove Siamo</h2>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 20, marginBottom: 32 }}>
                {[
                  { icon: '📍', label: 'Indirizzo', value: 'Via dei Mille, 16, 30174 Venezia VE', sub: 'Zona Bissuola' },
                  { icon: '📞', label: 'Telefono', value: '+39 320 223 5783' },
                  { icon: '💬', label: 'WhatsApp', value: '+39 320 223 5783' },
                  { icon: '✉️', label: 'Email', value: 'venicesportingcenter@gmail.com' },
                  { icon: '🕐', label: 'Orari', value: 'Lun-Ven 8:00-22:00 · Sab-Dom 8:00-20:00' },
                ].map((c, i) => (
                  <div key={i} style={{ display: 'flex', gap: 16, alignItems: 'flex-start' }}>
                    <div style={{
                      width: 44, height: 44, borderRadius: 12, background: 'var(--accent-light)',
                      display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20, flexShrink: 0,
                    }}>{c.icon}</div>
                    <div>
                      <div style={{ fontFamily: 'DM Sans, sans-serif', fontSize: 12, fontWeight: 600, color: 'var(--text-secondary)', textTransform: 'uppercase', letterSpacing: 1, marginBottom: 2 }}>{c.label}</div>
                      <div style={{ fontFamily: 'DM Sans, sans-serif', fontSize: 15, fontWeight: 600, color: 'var(--text)' }}>{c.value}</div>
                      {c.sub && <div style={{ fontFamily: 'DM Sans, sans-serif', fontSize: 13, color: 'var(--text-secondary)' }}>{c.sub}</div>}
                    </div>
                  </div>
                ))}
              </div>

            </div>
          </section>

          {/* Google Maps embed */}
          <section style={{ padding: '0 32px 64px', background: '#fff' }}>
            <div style={{ maxWidth: 1280, margin: '0 auto' }}>
              <iframe
                title="Venice Sporting Center"
                src="https://www.google.com/maps?q=Via+dei+Mille,+16,+30174+Venezia+VE,+Italy&output=embed"
                width="100%"
                height="450"
                style={{ border: 0, borderRadius: 20 }}
                allowFullScreen=""
                loading="lazy"
                referrerPolicy="no-referrer-when-downgrade"
              />
            </div>
          </section>
        </div>
      );
    }

    /* ─── FOOTER ─── */
    function Footer({ setPage }) {
      return (
        <footer style={{ background: 'var(--text)', padding: '64px 32px 32px' }}>
          <div style={{ maxWidth: 1280, margin: '0 auto' }}>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 40, marginBottom: 48 }}>
              <div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 16 }}>
                  <img src="assets/logo-vsc.png" alt="Venice Sporting Center" style={{ height: 68, width: 'auto', objectFit: 'contain', filter: 'brightness(0) invert(1)' }} />
                  <div style={{ fontFamily: 'Sora, sans-serif', fontWeight: 700, fontSize: 14, color: '#fff', lineHeight: 1.2 }}>
                    Venice<br/>Sporting Center
                  </div>
                </div>
                <p style={{ fontFamily: 'DM Sans, sans-serif', fontSize: 14, color: 'rgba(255,255,255,0.5)', lineHeight: 1.6 }}>
                  Il tuo centro sportivo a Mestre, Venezia.<br/>Tennis · Calcio a 5 · Beach Volley
                </p>
              </div>
              <div>
                <h4 style={{ fontFamily: 'Sora, sans-serif', fontSize: 13, fontWeight: 700, color: 'rgba(255,255,255,0.4)', textTransform: 'uppercase', letterSpacing: 1.5, marginBottom: 16 }}>Navigazione</h4>
                {['home','chi-siamo','prenotazioni','scuola-tennis','contatti'].map(id => (
                  <div key={id} style={{ marginBottom: 8 }}>
                    <button onClick={() => { setPage(id); window.scrollTo(0, 0); }} style={{
                      background: 'none', border: 'none', padding: 0, fontFamily: 'DM Sans, sans-serif', fontSize: 14,
                      color: 'rgba(255,255,255,0.6)', cursor: 'pointer', transition: 'color 0.2s',
                    }}
                      onMouseEnter={e => e.target.style.color = '#fff'}
                      onMouseLeave={e => e.target.style.color = 'rgba(255,255,255,0.6)'}>
                      {id === 'home' ? 'Home' : id.split('-').map(w => w[0].toUpperCase() + w.slice(1)).join(' ')}
                    </button>
                  </div>
                ))}
              </div>
              <div>
                <h4 style={{ fontFamily: 'Sora, sans-serif', fontSize: 13, fontWeight: 700, color: 'rgba(255,255,255,0.4)', textTransform: 'uppercase', letterSpacing: 1.5, marginBottom: 16 }}>Contatti</h4>
                <div style={{ fontFamily: 'DM Sans, sans-serif', fontSize: 14, color: 'rgba(255,255,255,0.6)', lineHeight: 2 }}>
                  Via dei Mille, 16, 30174 Venezia VE<br/>
                  Tel: +39 320 223 5783<br/>
                  WhatsApp: +39 320 223 5783<br/>
                  venicesportingcenter@gmail.com
                </div>
              </div>
              <div>
                <h4 style={{ fontFamily: 'Sora, sans-serif', fontSize: 13, fontWeight: 700, color: 'rgba(255,255,255,0.4)', textTransform: 'uppercase', letterSpacing: 1.5, marginBottom: 16 }}>Seguici</h4>
                <div style={{ display: 'flex', gap: 10 }}>
                  {[
                    { href: 'https://www.instagram.com/venicesportingcenter/', svg: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5"/></svg> },
                    { href: 'https://www.facebook.com/VscLaFavorita/', svg: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg> },
                  ].map((s, i) => (
                    <a key={i} href={s.href} target="_blank" rel="noopener noreferrer" style={{
                      width: 40, height: 40, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center',
                      background: 'rgba(255,255,255,0.1)', color: 'rgba(255,255,255,0.6)', transition: 'all 0.2s',
                    }}
                      onMouseEnter={e => { e.currentTarget.style.background = 'var(--accent)'; e.currentTarget.style.color = '#fff'; }}
                      onMouseLeave={e => { e.currentTarget.style.background = 'rgba(255,255,255,0.1)'; e.currentTarget.style.color = 'rgba(255,255,255,0.6)'; }}>
                      {s.svg}
                    </a>
                  ))}
                </div>
              </div>
            </div>
            <div style={{ borderTop: '1px solid rgba(255,255,255,0.1)', paddingTop: 24, display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12 }}>
              <p style={{ fontFamily: 'DM Sans, sans-serif', fontSize: 13, color: 'rgba(255,255,255,0.35)' }}>
                © 2026 Venice Sporting Center · Polisportiva Bissuola ASD
              </p>

            </div>
          </div>
        </footer>
      );
    }

    /* ─── APP ─── */
    function App() {
      const [page, setPage] = React.useState(() => {
        try { return localStorage.getItem('vsc-page') || 'home'; } catch { return 'home'; }
      });
      const [scrolled, setScrolled] = React.useState(false);

      React.useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 20);
        window.addEventListener('scroll', onScroll);
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      React.useEffect(() => {
        try { localStorage.setItem('vsc-page', page); } catch {}
        window.scrollTo(0, 0);
      }, [page]);

      const renderPage = () => {
        switch (page) {
          case 'chi-siamo':    return <ChiSiamoPage />;
          case 'prenotazioni': return <PrenotazioniPage />;
          case 'scuola-tennis': return <ScuolaTennisPage />;
          case 'contatti':     return <ContattiPage />;
          default:             return <HomePage setPage={setPage} />;
        }
      };

      return (
        <>
          <Nav currentPage={page} setPage={setPage} scrolled={scrolled} />
          <main>{renderPage()}</main>
          <Footer setPage={setPage} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
